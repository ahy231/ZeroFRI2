[package]
name = "p3-utils"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
members = ["baby-bear", "bn254-fr", "fri"]

[workspace.dependencies]
# External dependencies used across baby-bear, fri, and bn254-fr
criterion = "0.5.1"
ff = "0.13"
itertools = "0.14.0"
halo2curves = "0.8.0"
num-bigint = { version = "0.4.3", default-features = false }
num-integer = "0.1.46"
num-traits = { version = "0.2.19", default-features = false }
nums = "0.1.0"
rand = "0.8.5"
rayon = "1.7.0"
transpose = "0.2.3"              
rand_chacha = "0.3.1"
rand_xoshiro = "0.6.0"
serde = { version = "1.0", default-features = false }
serde_json = "1.0.113"
gcd = "1.0" 
hashbrown = "0.14" 
tracing = "0.1.37"
tracing-forest = "0.1.6" 
tracing-subscriber = "0.3.19"  
tiny-keccak = "2.0.2" 
blake3 = "1.5.5"  
num = "0.4.3" 
sha3 = "0.11.0-pre.4" 
modinverse = "0.1.1" 
zkhash = { git = "https://github.com/HorizenLabs/poseidon2" }

# Local dependencies required by the workspaces (referenced with workspace = true)
p3-field = { path = "field", workspace = true }
p3-mds = { path = "mds", workspace = true }
p3-monty-31 = { path = "monty-31", workspace = true }
p3-poseidon2 = { path = "poseidon2", workspace = true }
p3-symmetric = { path = "symmetric", workspace = true }
p3-challenger = { path = "challenger", version = "0.1.0" }
p3-commit = { path = "commit", version = "0.1.0" }
p3-dft = { path = "dft", workspace = true }
p3-interpolation = { path = "interpolation", version = "0.1.0" }
p3-matrix = { path = "matrix", version = "0.1.0" }
p3-maybe-rayon = { path = "maybe-rayon", version = "0.1.0" }
p3-util = { path = "util", version = "0.1.0" }
p3-bn254-fr = { path = "bn254-fr", version = "0.1.0" }
p3-field-testing = { path = "field-testing", workspace = true }
p3-baby-bear = { path="baby-bear", workspace = true }
p3-circle = { path = "circle", version = "0.1.0" }
p3-goldilocks = { path = "goldilocks", version = "0.1.0" }
p3-keccak = { path = "keccak", version = "0.1.0" }
p3-mersenne-31 = { path = "mersenne-31", version = "0.1.0" }
p3-merkle-tree = { path = "merkle-tree", version = "0.1.0" }
p3-koala-bear = { path = "koala-bear", version = "0.1.0" }
p3-poseidon = { path = "poseidon", version = "0.1.0" }
p3-fri = { path = "fri", version = "0.1.0" }
p3-rescue = { path = "rescue", version = "0.0.1" }
p3-blake3 = { path = "blake3", version = "0.1.0" }

[profile.profiling]
inherits = "release"
debug = true
