[package]
name = "plonkish_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
aes = "0.8"
hex-literal = "0.4.1"
criterion = "0.4.0"
csv = "1.3.0"
ctr = { git = "https://github.com/RustCrypto/block-modes", rev = "78fefba5a80f3d788fd8ba7c4483625148f5dc18" }
halo2_curves = { git = "https://github.com/privacy-scaling-explorations/halo2curves", tag = "v0.4.0", package = "halo2curves", features = [
    "derive_serde",
] }
ff = { version = "0.13.0", features = ["derive"] }
ff-derive-num = "0.2.0"
pasta_curves = { version = "0.5.1", features = ["serde"] }
generic-array = { version = "0.14.7", features = ["serde"] }
bitvec = "1.0.1"
itertools = "0.13.0"
num-bigint = "0.4.6"
num-traits = "0.2"
num-integer = "0.1.46"
rand = "0.8.5"
serde = { version = "1.0.152", features = ["derive"] }
threadpool = "1.8.1"
bincode = "1.3.3"
blake3 = "1.3"
once_cell = "1.19"
rs_merkle = "1.3"
serde_with = "3.0"
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10.8"
blake2b_simd = "1.0.2"
blake2 = { version = "0.10.6" }
poseidon = { git = "https://github.com/han0110/poseidon", branch = "feature/with-spec" }
rand_chacha = { version = "0.3.1", features = ["serde1"] }
rand_9 = { package = "rand", version = "0.9.0" }
rand_chacha_9 = { package = "rand_chacha", version = "0.9.0" }
# timer
ark-std = { version = "^0.4.0", default-features = false, optional = true }

# parallel
rayon = { version = "1.5.3", optional = true }
subtle = "2.5.0"
# frontend-halo2
halo2_proofs = { git = "https://github.com/han0110/halo2.git", branch = "feature/for-benchmark", optional = true }
plonky2_util = { path = "../plonky2_util" }
crossbeam = "0.8.2"

# plonky3
p3-air = { git = "https://github.com/Plonky3/Plonky3" }
p3-field = { git = "https://github.com/Plonky3/Plonky3" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3" }
p3-mersenne-31 = { git = "https://github.com/Plonky3/Plonky3" }
p3-util = { git = "https://github.com/Plonky3/Plonky3" }
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3" }
p3-circle = { git = "https://github.com/Plonky3/Plonky3" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3" }
p3-goldilocks = { git = "https://github.com/Plonky3/Plonky3" }
p3-blake3 = { git = "https://github.com/Plonky3/Plonky3" }
p3-keccak = { git = "https://github.com/Plonky3/Plonky3" }
p3-mds = { git = "https://github.com/Plonky3/Plonky3" }
p3-poseidon = { git = "https://github.com/Plonky3/Plonky3" }
p3-poseidon2 = { git = "https://github.com/Plonky3/Plonky3" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3" }
p3-monty-31 = { git = "https://github.com/Plonky3/Plonky3" }
p3-bn254-fr = { git = "https://github.com/Plonky3/Plonky3" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3" }

serde_json.workspace = true

[dev-dependencies]
paste = "1.0.11"
criterion = "0.4.0"
pprof = { version = "0.11.0", features = ["criterion", "flamegraph"] }
crossbeam = "0.8.2"
[features]
default = ["parallel", "frontend-halo2", "sanity-check"]

timer = ["dep:ark-std", "ark-std?/print-trace", "halo2_proofs?/print-trace"]
parallel = ["dep:rayon"]
frontend-halo2 = ["dep:halo2_proofs"]

benchmark = ["parallel"]
sanity-check = []

[[bench]]
name = "zero_check"
harness = false
required-features = ["benchmark"]
