[package]
name = "benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = { package = "rand", version = "0.8.5" }
rand_9 = { package = "rand", version = "0.9.0" }
rand_chacha = "0.9.0"
itertools = "0.10.5"
gnuplot = "0.0.37"
rayon = "1.5.3"
prettytable = "0.10"
criterion = "0.5"
bincode = "1.3"
plonky2_util = { path = "../plonky2_util" }

# plonkish_backend
plonkish_backend = { path = "../plonkish_backend", features = ["benchmark"] }

# halo2
halo2_proofs = { git = "https://github.com/han0110/halo2.git", branch = "feature/for-benchmark" }
halo2_gadgets = { git = "https://github.com/han0110/halo2.git", branch = "feature/for-benchmark", features = [
    "unstable",
] }
snark-verifier = { git = "https://github.com/han0110/snark-verifier", branch = "feature/for-benchmark", default-features = false, features = [
    "loader_halo2",
    "system_halo2",
] }
ff = { version = "0.13.0" }

# espresso
ark-ff = { version = "0.4.0", default-features = false }
ark-bn254 = { version = "0.4.0", default-features = false, features = [
    "curve",
] }
espresso_subroutines = { git = "https://github.com/EspressoSystems/hyperplonk", rev = "56b1085", package = "subroutines", default-features = false, features = [
    "parallel",
] }
espresso_hyperplonk = { git = "https://github.com/EspressoSystems/hyperplonk", rev = "56b1085", package = "hyperplonk", default-features = false, features = [
    "parallel",
] }

# plonky3
p3-air = { git = "https://github.com/Plonky3/Plonky3" }
p3-field = { git = "https://github.com/Plonky3/Plonky3" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3" }
p3-mersenne-31 = { git = "https://github.com/Plonky3/Plonky3" }
p3-util = { git = "https://github.com/Plonky3/Plonky3" }
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3" }
p3-circle = { git = "https://github.com/Plonky3/Plonky3" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3" }
p3-goldilocks = { git = "https://github.com/Plonky3/Plonky3" }
p3-blake3 = { git = "https://github.com/Plonky3/Plonky3" }
p3-keccak = { git = "https://github.com/Plonky3/Plonky3" }
p3-mds = { git = "https://github.com/Plonky3/Plonky3" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3" }
p3-poseidon = { git = "https://github.com/Plonky3/Plonky3" }
p3-poseidon2 = { git = "https://github.com/Plonky3/Plonky3" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3" }
p3-monty-31 = { git = "https://github.com/Plonky3/Plonky3" }
p3-bn254-fr = { git = "https://github.com/Plonky3/Plonky3" }
serde = { version = "1.0", features = ["derive"] }
num-bigint = "0.4"
num-traits = "0.2"
serde_json = "1.0"
sha2 = "0.10"

[features]
default = []
timer = [
    "plonkish_backend/timer",
    "halo2_proofs/print-trace",
    "espresso_subroutines/print-trace",
    "espresso_hyperplonk/print-trace",
]


[[bench]]
name = "brakedown_proof_system"
harness = false
